[project]
name = "beagle"
version = "0.1.0"
description = "Beagle — the friend who knows your group, and helps it grow. Agent backend (branches A/B/D)."
requires-python = ">=3.11"
dependencies = [
    # core (A)
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "httpx",
    "websockets",
    "anthropic",          # official SDK — AnthropicRouter (tier→model routing)
    "python-dotenv",
    # data & intelligence (D) — seeded now so pyproject is frozen after hour 0
    "numpy",
    "spotipy",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "sqlite-vec",
    "sentence-transformers",  # CLIP-style image + text embeddings
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["src"]
