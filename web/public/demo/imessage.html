<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hometown guys</title>
<style>
  /* throwaway demo prop: a 1:1 scripted replay of the championship-night
     thread, styled as iMessage, for screen recording. not linked anywhere. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 390px; height: 844px; background: #fff;
    border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 12px #1c1c1e, 0 0 0 14px #3a3a3c, 0 30px 80px rgb(0 0 0 / 0.6);
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 54px; flex-shrink: 0; display: flex; align-items: flex-end;
    justify-content: space-between; padding: 0 28px 6px; font-size: 15px; font-weight: 600;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; font-size: 13px; letter-spacing: -0.5px; }
  .header {
    flex-shrink: 0; text-align: center; padding: 2px 14px 8px;
    background: rgba(249, 249, 249, 0.94); border-bottom: 0.5px solid #c6c6c8;
    position: relative;
  }
  .back { position: absolute; left: 10px; top: 6px; color: #007aff; font-size: 26px; }
  .back sup { font-size: 12px; font-weight: 600; background: #007aff; color: #fff; border-radius: 999px; padding: 1px 6px; position: relative; top: -8px; left: -4px; }
  .avatars { display: flex; justify-content: center; margin-bottom: 2px; }
  .av {
    width: 40px; height: 40px; border-radius: 50%; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; margin: 0 -7px;
    border: 2px solid #f9f9f9;
    background: linear-gradient(180deg, #9a9fa8, #7d818a);
  }
  .av.dog { background: linear-gradient(180deg, #c98a4b, #a96a2e); font-size: 20px; }
  .gname { font-size: 12px; color: #000; }
  .gname .chev { color: #b0b0b6; font-size: 10px; }
  .scroll {
    flex: 1; overflow-y: auto; padding: 10px 14px 6px; background: #fff;
    display: flex; flex-direction: column; gap: 2px;
  }
  .daystamp {
    text-align: center; font-size: 11px; color: #8e8e93; margin: 8px 0 10px;
    font-weight: 500;
  }
  .daystamp b { font-weight: 600; }
  .sender {
    font-size: 11px; color: #8e8e93; margin: 8px 0 1px 46px;
  }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .row .avmini {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; margin-bottom: 1px;
    background: linear-gradient(180deg, #9a9fa8, #7d818a);
    visibility: hidden;
  }
  .row.last .avmini { visibility: visible; }
  .row .avmini.dog { background: linear-gradient(180deg, #c98a4b, #a96a2e); font-size: 15px; }
  .bubble {
    max-width: 268px; padding: 7px 12px; font-size: 16.5px; line-height: 1.28;
    border-radius: 18px; position: relative;
    animation: pop 260ms cubic-bezier(0.24, 1.24, 0.4, 1);
    transform-origin: bottom left;
    white-space: pre-wrap;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.86) translateY(6px); } to { opacity: 1; transform: none; } }
  .in .bubble { background: #e9e9eb; color: #000; border-bottom-left-radius: 5px; }
  .in.last .bubble { border-bottom-left-radius: 18px; }
  .in.last .bubble::before {
    content: ""; position: absolute; left: -5px; bottom: 0; width: 12px; height: 18px;
    background: radial-gradient(circle at 0 0, transparent 11px, #e9e9eb 11.5px);
  }
  .out { justify-content: flex-end; }
  .out .bubble { background: #0a84ff; color: #fff; border-bottom-right-radius: 5px; transform-origin: bottom right; }
  .out.last .bubble { border-bottom-right-radius: 18px; }
  .out.last .bubble::before {
    content: ""; position: absolute; right: -5px; bottom: 0; width: 12px; height: 18px;
    background: radial-gradient(circle at 12px 0, transparent 11px, #0a84ff 11.5px);
  }
  .delivered {
    text-align: right; font-size: 10.5px; color: #8e8e93; font-weight: 500;
    margin: 2px 4px 4px 0;
  }
  .typing .bubble { display: inline-flex; gap: 4px; padding: 12px 14px; }
  .typing .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #b6b6bb;
    animation: blink 1.2s ease-in-out infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.18s; }
  .typing .dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.35; } 30% { opacity: 1; } }
  .inputbar {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 6px 12px 8px; background: #fff;
  }
  .plus {
    width: 32px; height: 32px; border-radius: 50%; background: #e9e9eb;
    color: #7c7c82; font-size: 22px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-weight: 300;
  }
  .field {
    flex: 1; border: 1px solid #d7d7dc; border-radius: 999px;
    padding: 6px 14px; font-size: 16px; color: #b8b8bf;
    display: flex; justify-content: space-between; align-items: center;
  }
  .field .mic { color: #8e8e93; font-size: 15px; }
  .homebar {
    height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: #fff;
  }
  .homebar span { width: 140px; height: 5px; border-radius: 999px; background: #1c1c1e; }
  .hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    color: #4a4a4e; font-size: 13px; user-select: none;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">▪▪▪▪ ᯤ ▮</span></div>
  <div class="header">
    <div class="back">‹<sup>7</sup></div>
    <div class="avatars">
      <span class="av">C</span><span class="av dog">🐶</span><span class="av">P</span>
    </div>
    <div class="gname">hometown guys <span class="chev">›</span></div>
  </div>
  <div class="scroll" id="scroll">
    <div class="daystamp"><b>Today</b> 5:42 PM</div>
  </div>
  <div class="inputbar">
    <div class="plus">+</div>
    <div class="field"><span>iMessage</span><span class="mic">🎙︎</span></div>
  </div>
  <div class="homebar"><span></span></div>
</div>
<div class="hint" id="hint">click to play · R restarts</div>

<script>
  // The championship-night arc, 1:1 with what beagle actually does.
  // who: "me" = Joseph (blue). Everyone else renders incoming with a name tag.
  // t = ms pause before this message; typing = show typing dots first (ms).
  const SCRIPT = [
    { who: "me",        text: "boys. friday. thoughts", t: 900 },
    { who: "Cristiano", text: "kbbq then fifa at mine. non negotiable", t: 2200, typing: 1700 },
    { who: "Cam",       text: "negotiable if you unplug my controller again", t: 1400, typing: 1900 },
    { who: "me",        text: "@beagle settle it", t: 2400 },
    { who: "beagle",    text: "on it. checking all six calendars, brb 🐶", t: 1500, typing: 1400 },
    { who: "beagle",    text: "verdict: friday 8pm is clean across the board. gen korean bbq first, fifa at cristiano's after. locking in one hour unless someone objects", t: 3600, typing: 2600 },
    { who: "Paul",      text: "objection withheld strategically", t: 2600, typing: 1800 },
    { who: "beagle",    text: "locked: championship night, friday 8pm. kbbq then fifa at cristiano's. controllers charged, grudges optional. calendar invites are out 🐶", t: 3400, typing: 2200 },
    { who: "Cam",       text: "BEST NIGHT OF OUR LIVES INCOMING (again)", t: 1800, typing: 1300 },
    { who: "Fortune",   text: "there by 8 sharp (8:40)", t: 1600, typing: 1500 },
    { who: "Leandro",   text: "i'll drive. obviously", t: 1700, typing: 1400 },
  ];

  const scroll = document.getElementById("scroll");
  const hint = document.getElementById("hint");
  let timers = [];
  let lastRow = null, lastWho = null;

  const sleep = (ms) => new Promise((r) => timers.push(setTimeout(r, ms)));
  const down = () => scroll.scrollTo({ top: scroll.scrollHeight, behavior: "smooth" });

  function addRow(who, node, isTyping) {
    const inbound = who !== "me";
    if (inbound && who !== lastWho && !isTyping) {
      const s = document.createElement("div");
      s.className = "sender";
      s.textContent = who;
      scroll.appendChild(s);
    }
    if (lastRow && lastWho === who) lastRow.classList.remove("last");
    const row = document.createElement("div");
    row.className = `row last ${inbound ? "in" : "out"}${isTyping ? " typing" : ""}`;
    if (inbound) {
      const av = document.createElement("div");
      av.className = "avmini" + (who === "beagle" ? " dog" : "");
      av.textContent = who === "beagle" ? "🐶" : who[0];
      row.appendChild(av);
    }
    row.appendChild(node);
    scroll.appendChild(row);
    lastRow = row; lastWho = who;
    down();
    return row;
  }

  function bubble(text) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    return b;
  }

  function typingBubble() {
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    return b;
  }

  async function play() {
    for (const m of SCRIPT) {
      await sleep(m.t);
      if (m.typing && m.who !== "me") {
        const t = addRow(m.who, typingBubble(), true);
        await sleep(m.typing);
        t.remove();
        if (lastRow === t) { lastRow = null; lastWho = null; }
      }
      addRow(m.who, bubble(m.text), false);
    }
    await sleep(600);
    const d = document.createElement("div");
    d.className = "delivered";
    d.textContent = "Delivered";
    scroll.appendChild(d);
    down();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    scroll.innerHTML = '<div class="daystamp"><b>Today</b> 5:42 PM</div>';
    lastRow = null; lastWho = null;
  }

  let started = false;
  document.body.addEventListener("click", () => {
    if (started) return;
    started = true;
    hint.style.display = "none";
    play();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "r") {
      reset(); started = true; hint.style.display = "none"; play();
    }
  });
</script>
</body>
</html>
