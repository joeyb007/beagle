<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hometown guys</title>
<style>
  /* demo prop: scripted replay of the championship-night thread, replicating
     iMessage (iOS light) to the pixel for screen recording. not linked. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d0d0f;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 390px; height: 844px; background: #fff;
    border-radius: 54px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 13px #0f0f10, 0 0 0 15px #4a4a4e, 0 40px 90px rgb(0 0 0 / 0.7);
    display: flex; flex-direction: column;
  }
  .phone::before {
    content: ""; position: absolute; left: -16px; top: 180px; width: 3px; height: 62px;
    background: #3c3c40; border-radius: 2px; box-shadow: 0 96px 0 #3c3c40, 0 -66px 0 0 #3c3c40;
  }
  .phone::after {
    content: ""; position: absolute; right: -16px; top: 230px; width: 3px; height: 92px;
    background: #3c3c40; border-radius: 2px;
  }

  .statusbar {
    height: 56px; flex-shrink: 0; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 30px 0 42px; background: #f4f4f6;
  }
  .statusbar .time { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; font-family: "SF Pro Display", -apple-system, sans-serif; }
  .island {
    position: absolute; left: 50%; top: 13px; transform: translateX(-50%);
    width: 122px; height: 35px; background: #000; border-radius: 999px;
  }
  .sicons { display: flex; align-items: center; gap: 8px; }
  .sicons svg { display: block; }

  .header {
    flex-shrink: 0; text-align: center; padding: 5px 14px 7px;
    background: #f4f4f6f2; backdrop-filter: blur(12px);
    border-bottom: 0.5px solid #c6c6c8; position: relative; z-index: 3;
  }
  .back {
    position: absolute; left: 20px; top: 26px; width: 13px; height: 13px;
    border-left: 3px solid #0a7cff; border-bottom: 3px solid #0a7cff;
    transform: rotate(45deg); border-radius: 1.5px;
  }
  .facetime { position: absolute; right: 20px; top: 28px; }
  .avatars { display: flex; justify-content: center; margin-bottom: 3px; }
  .av {
    width: 50px; height: 50px; border-radius: 50%; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 500; margin: 0 -10px;
    border: 2.5px solid #f4f4f6;
    background: linear-gradient(180deg, #a8aeb7, #878d97);
    font-family: "SF Pro Display", -apple-system, sans-serif;
  }
  .av.dog { background: linear-gradient(180deg, #d09150, #a96a2e); font-size: 25px; z-index: 2; }
  .gname { font-size: 11.5px; color: #000; font-weight: 400; letter-spacing: -0.1px; }
  .gname .chev { color: #b6b6bc; font-size: 10px; font-weight: 700; }

  .scroll {
    flex: 1; overflow-y: auto; padding: 8px 16px 4px; background: #fff;
    display: flex; flex-direction: column;
  }
  .stamp { text-align: center; margin: 10px 0 12px; }
  .stamp .svc { font-size: 11px; color: #86868b; font-weight: 500; }
  .stamp .when { font-size: 11px; color: #86868b; }
  .stamp .when b { font-weight: 600; }

  .sender { font-size: 11px; color: #86868b; margin: 8px 0 2px 46px; letter-spacing: -0.1px; }
  .row { display: flex; align-items: flex-end; gap: 7px; margin-top: 1.5px; }
  .row.newspeaker { margin-top: 8px; }
  .row .avmini {
    width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; margin-bottom: 1px;
    background: linear-gradient(180deg, #a8aeb7, #878d97);
    visibility: hidden;
  }
  .row.last .avmini { visibility: visible; }
  .row .avmini.dog { background: linear-gradient(180deg, #d09150, #a96a2e); font-size: 14px; }

  .bubble {
    max-width: 264px; padding: 7.5px 13px 8.5px; font-size: 17px; line-height: 1.24;
    border-radius: 20px; position: relative; letter-spacing: -0.3px;
    white-space: pre-wrap;
  }
  .in .bubble {
    background: #e9e9eb; color: #000;
    animation: popin 300ms cubic-bezier(0.22, 1.24, 0.36, 1);
    transform-origin: bottom left;
  }
  @keyframes popin { from { opacity: 0; transform: scale(0.82) translateY(6px); } to { opacity: 1; transform: none; } }
  .in.last .bubble::before {
    content: ""; position: absolute; left: -5.5px; bottom: -0.5px; width: 13px; height: 20px;
    background: radial-gradient(circle at 0 0, transparent 12px, #e9e9eb 12.5px);
  }
  .out { justify-content: flex-end; }
  .out .bubble {
    background: #0a7cff; color: #fff; transform-origin: bottom right;
    animation: sendup 380ms cubic-bezier(0.2, 1.1, 0.3, 1);
  }
  /* apple's send: the bubble launches up out of the compose field */
  @keyframes sendup {
    0% { opacity: 0.6; transform: translateY(54px) scale(0.94); }
    70% { opacity: 1; transform: translateY(-3px) scale(1.005); }
    100% { opacity: 1; transform: none; }
  }
  .out.last .bubble::before {
    content: ""; position: absolute; right: -5.5px; bottom: -0.5px; width: 13px; height: 20px;
    background: radial-gradient(circle at 13px 0, transparent 12px, #0a7cff 12.5px);
  }
  .delivered { text-align: right; font-size: 11px; color: #86868b; font-weight: 600; margin: 3px 3px 3px 0; }

  .typing .bubble { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing.last .bubble::before { display: none; }
  /* the typing bubble's cascade tail: two shrinking dots at the corner */
  .typing .bubble::after {
    content: ""; position: absolute; left: -2px; bottom: -3px;
    width: 10px; height: 10px; border-radius: 50%; background: #e9e9eb;
    box-shadow: -7px 6px 0 -3px #e9e9eb;
  }
  .typing .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #b0b0b6;
    animation: blink 1.3s ease-in-out infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.4; transform: scale(0.92); } 30% { opacity: 1; transform: scale(1); } }

  .inputbar {
    flex-shrink: 0; display: flex; align-items: center; gap: 16px;
    padding: 7px 14px 7px 16px; background: #fff;
  }
  .inputbar svg { flex-shrink: 0; }
  .field {
    flex: 1; border: 1.2px solid #dedee3; border-radius: 999px;
    padding: 6px 34px 6px 14px; font-size: 17px; min-height: 35px;
    color: #c3c3c9; position: relative; display: flex; align-items: center;
    letter-spacing: -0.3px;
  }
  .field .typed { color: #000; white-space: nowrap; overflow: hidden; }
  .field .caret {
    display: inline-block; width: 2px; height: 21px; background: #0a7cff;
    margin-left: 1px; animation: caret 1.06s steps(1) infinite; vertical-align: -4px;
    border-radius: 1px;
  }
  @keyframes caret { 50% { opacity: 0; } }
  .field .mic { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); }
  .field .send {
    position: absolute; right: 3.5px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%; background: #0a7cff;
    display: none; align-items: center; justify-content: center;
    animation: popin 160ms ease-out;
  }
  .field.ready .mic { display: none; }
  .field.ready .send { display: flex; }
  .field .send::before {
    content: ""; width: 9px; height: 9px; margin-top: 3px;
    border-left: 2.6px solid #fff; border-top: 2.6px solid #fff;
    transform: rotate(45deg); border-radius: 1px;
  }

  /* app strip: hand-drawn replicas of the iOS row */
  .appstrip {
    flex-shrink: 0; display: flex; justify-content: space-around; align-items: center;
    padding: 3px 16px 7px; background: #fff;
  }
  .appstrip svg { display: block; }

  .kb { flex-shrink: 0; background: #d1d4d9; padding: 8px 3px 4px; position: relative; }
  .krow { display: flex; justify-content: center; gap: 6px; margin-bottom: 9px; }
  .key {
    background: #fff; border-radius: 5px; box-shadow: 0 1px 0 #8b8d90;
    width: 33.5px; height: 42px; display: flex; align-items: center; justify-content: center;
    font-size: 23px; font-weight: 400; position: relative;
    font-family: "SF Pro Display", -apple-system, sans-serif;
    transition: background-color 60ms;
  }
  .key.pressed { background: #b6bcc7; }
  /* the iOS key-pop balloon */
  .key .pop {
    position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
    width: 52px; height: 54px; background: #fff; border-radius: 10px;
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; z-index: 5;
  }
  .key.wide { width: 45px; background: #adb3be; font-size: 16px; box-shadow: 0 1px 0 #83858a; }
  .key.space { width: 199px; font-size: 16px; }
  .key.ret { width: 90px; background: #adb3be; font-size: 16px; box-shadow: 0 1px 0 #83858a; }
  .kfoot { display: flex; justify-content: space-between; padding: 3px 32px 0; }
  .kfoot svg { display: block; }
  .homebar { height: 21px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #d1d4d9; }
  .homebar span { width: 139px; height: 5px; border-radius: 999px; background: #0f0f10; }
  .hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #55555a; font-size: 13px; user-select: none; }
</style>
</head>

<script>
  // The championship-night arc, 1:1 with what beagle actually does.
  // who: "me" = Joseph (blue; typed on the keyboard with key pops, then sent).
  const SCRIPT = [
    { who: "me",        text: "yo what are we on friday", t: 900 },
    { who: "Cristiano", text: "kbbq then fifa at mine", t: 1800, typing: 1700 },
    { who: "Cam",       text: "im down if cris doesnt rage quit again", t: 1300, typing: 1900 },
    { who: "me",        text: "@beagle when are we all free", t: 1800 },
    { who: "beagle",    text: "say less, checking everyone's week 🐶", t: 1400, typing: 1400 },
    { who: "beagle",    text: "friday 8pm works for all 6 of you. thinking gen korean bbq at 8, fifa at cristiano's after. want me to lock it?", t: 3200, typing: 2600 },
    { who: "Paul",      text: "yeah lock it", t: 2400, typing: 1500 },
    { who: "Fortune",   text: "lock it 🔥", t: 1200, typing: 1100 },
    { who: "beagle",    text: "locked. friday 8pm, gen korean bbq then fifa at cristiano's. calendar invites sent 🔒", t: 2800, typing: 2100 },
    { who: "Cam",       text: "LETS GOOO", t: 1500, typing: 1000 },
    { who: "Leandro",   text: "i can drive", t: 1500, typing: 1400 },
    { who: "Cristiano", text: "charge your controllers. no excuses this time", t: 1600, typing: 1600 },
  ];

  const scroll = document.getElementById("scroll");
  const hint = document.getElementById("hint");
  const field = document.getElementById("field");
  const fieldtext = document.getElementById("fieldtext");
  const keys = {};
  document.querySelectorAll(".key[data-k]").forEach((k) => (keys[k.dataset.k] = k));
  let timers = [];
  let lastRow = null, lastWho = null, deliveredEl = null;

  const sleep = (ms) => new Promise((r) => timers.push(setTimeout(r, ms)));
  const down = () => scroll.scrollTo({ top: scroll.scrollHeight, behavior: "smooth" });

  function addRow(who, node, isTyping) {
    const inbound = who !== "me";
    const speakerChanged = lastWho !== null && lastWho !== who;
    if (inbound && who !== lastWho && !isTyping) {
      const s = document.createElement("div");
      s.className = "sender";
      s.textContent = who;
      scroll.appendChild(s);
    }
    if (lastRow && lastWho === who) lastRow.classList.remove("last");
    const row = document.createElement("div");
    row.className = `row last ${inbound ? "in" : "out"}${isTyping ? " typing" : ""}` +
      (speakerChanged && !inbound ? " newspeaker" : "");
    if (inbound) {
      const av = document.createElement("div");
      av.className = "avmini" + (who === "beagle" ? " dog" : "");
      av.textContent = who === "beagle" ? "🐶" : who[0];
      row.appendChild(av);
    }
    row.appendChild(node);
    scroll.appendChild(row);
    lastRow = row; lastWho = who;
    down();
    return row;
  }

  function bubble(text) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    return b;
  }

  function typingBubble() {
    const b = document.createElement("div");
    b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    b.className = "bubble";
    return b;
  }

  async function pressKey(ch) {
    const k = keys[ch.toLowerCase()];
    if (!k) return;
    k.classList.add("pressed");
    if (ch !== " ") {
      const pop = document.createElement("div");
      pop.className = "pop";
      pop.textContent = ch.toUpperCase();
      k.appendChild(pop);
      setTimeout(() => pop.remove(), 110);
    }
    setTimeout(() => k.classList.remove("pressed"), 90);
  }

  async function typeAndSend(text) {
    fieldtext.innerHTML = '<span class="typed"></span><span class="caret"></span>';
    const typed = fieldtext.querySelector(".typed");
    for (let i = 0; i < text.length; i++) {
      pressKey(text[i]);
      typed.textContent = text.slice(0, i + 1);
      if (i === 0) field.classList.add("ready");
      await sleep(48 + Math.random() * 52);
    }
    await sleep(430);
    field.classList.remove("ready");
    fieldtext.textContent = "iMessage";
    if (deliveredEl) { deliveredEl.remove(); deliveredEl = null; }
    addRow("me", bubble(text), false);
    deliveredEl = document.createElement("div");
    deliveredEl.className = "delivered";
    deliveredEl.textContent = "Delivered";
    scroll.appendChild(deliveredEl);
    down();
  }

  async function play() {
    for (const m of SCRIPT) {
      await sleep(m.t);
      if (m.who === "me") {
        await typeAndSend(m.text);
        continue;
      }
      if (m.typing) {
        const t = addRow(m.who, typingBubble(), true);
        await sleep(m.typing);
        t.remove();
        if (lastRow === t) { lastRow = null; lastWho = null; }
      }
      addRow(m.who, bubble(m.text), false);
    }
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    scroll.innerHTML = '<div class="stamp"><div class="svc">iMessage</div><div class="when"><b>Today</b> 5:42 PM</div></div>';
    lastRow = null; lastWho = null; deliveredEl = null;
    field.classList.remove("ready");
    fieldtext.textContent = "iMessage";
  }

  let started = false;
  document.body.addEventListener("click", () => {
    if (started) return;
    started = true;
    hint.style.display = "none";
    play();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "r") {
      reset(); started = true; hint.style.display = "none"; play();
    }
  });
</script>
</body>
</html>
